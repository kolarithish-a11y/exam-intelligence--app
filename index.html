<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Exam Intelligence</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e5e7eb;--brand:#5b5ce2;--brand2:#7c3aed;--soft:#eef0ff;--good:#16a34a;--bad:#dc2626;--warn:#d97706;--shadow:0 12px 35px rgba(15,23,42,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}
body.dark{--bg:#0b1220;--card:#111827;--text:#f8fafc;--muted:#98a2b3;--line:#273244;--soft:#1c2440}
#app{max-width:1100px;margin:auto;padding:0 14px 100px}.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);padding:10px 0}.bar{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 8px 22px #5b5ce244}.brand b{display:block;font-size:16px}.brand span{font-size:10px;color:var(--muted)}.actions{margin-left:auto;display:flex;gap:7px}.icon{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:13px;color:var(--text)}
.view{display:none}.view.active{display:block}.hero{margin-top:10px;border-radius:28px;padding:23px;color:#fff;background:linear-gradient(135deg,#101827,#282e67 62%,#5b5ce2);box-shadow:var(--shadow)}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:900;opacity:.8}.hero h1{font-size:28px;line-height:1.1;margin:8px 0}.hero p{font-size:13px;line-height:1.55;color:#d8dbef;margin:0}.hero .date{font-size:11px;color:#d8dbef;margin-top:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:17px}.stat{padding:12px;border-radius:16px;background:#ffffff12;border:1px solid #ffffff1d}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#cbd0e8}.notice{margin-top:10px;padding:10px 12px;border-radius:13px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:11px;line-height:1.4}.dark .notice{background:#2a1d0e;color:#fdba74;border-color:#7c4516}
.section{margin-top:23px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.head h2{font-size:17px;margin:0}.link{border:0;background:transparent;color:var(--brand);font-weight:850;font-size:11px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 12px;white-space:nowrap;font-size:11px;font-weight:800}.chip.active{background:var(--soft);color:var(--brand);border-color:#d7d9ff}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.card.featured{background:linear-gradient(160deg,var(--card),var(--soft))}.tag{display:inline-block;padding:5px 8px;border-radius:8px;background:var(--soft);color:var(--brand);font-size:9px;font-weight:900}.card h3{font-size:15px;line-height:1.3;margin:10px 0 6px}.card p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.meta{font-size:9px;color:var(--muted);margin-top:11px}.learning{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.learn{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;text-align:left}.learn .ico{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px}.learn b{font-size:12px}.learn small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.learn i{margin-left:auto;color:var(--brand);font-style:normal}
.search{width:100%;padding:12px 13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;outline:0}.list{display:grid;gap:10px}.row{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.row h3{font-size:14px;margin:8px 0 5px}.row p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.btn{border:0;border-radius:13px;background:var(--brand);color:#fff;padding:11px 14px;font-size:12px;font-weight:850}.btn.secondary{background:var(--soft);color:var(--brand)}.btn.danger{background:#fff1f2;color:var(--bad)}.btn.full{width:100%;margin-top:11px}.btn:disabled{opacity:.5;cursor:not-allowed}
.article{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:19px}.article h1{font-size:24px;line-height:1.18;margin:10px 0}.article h2{font-size:15px;margin:20px 0 6px}.article p,.article li{font-size:13px;line-height:1.65;color:var(--muted)}.callout{background:var(--soft);border-left:4px solid var(--brand);padding:12px;border-radius:12px;font-size:12px;line-height:1.5}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}.qtop{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.quiz h2{font-size:18px;line-height:1.45}.options{display:grid;gap:8px}.opt{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:13px;text-align:left;font-size:13px;font-weight:700}.opt.sel{border-color:var(--brand);background:var(--soft)}.opt.correct{border-color:#86efac;background:#f0fdf4;color:#166534}.opt.wrong{border-color:#fca5a5;background:#fff1f2;color:#991b1b}.feedback{margin-top:12px;padding:12px;border-radius:14px;background:#f8fafc;color:#475467;font-size:12px;line-height:1.5}.dark .feedback{background:#172033;color:#cbd5e1}
.chat{display:grid;gap:9px}.bubble{max-width:88%;padding:12px 14px;border-radius:17px;font-size:13px;line-height:1.5}.bubble.ai{background:var(--card);border:1px solid var(--line)}.bubble.me{margin-left:auto;background:var(--brand);color:#fff}.chatbar{display:flex;gap:7px;margin-top:10px}.chatbar input{flex:1}.profile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}.avatar{width:55px;height:55px;border-radius:17px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px}.profilehead{display:flex;gap:11px;align-items:center}.profile h2{font-size:18px;margin:0}.profile p{font-size:11px;color:var(--muted);margin:4px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.metric{text-align:center;background:var(--soft);border-radius:14px;padding:11px}.metric b{font-size:17px}.metric span{display:block;color:var(--muted);font-size:9px;margin-top:3px}.barline{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:10px}.barline i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.archivegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.year{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.year b{font-size:18px}.year small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.bottom{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:10px;width:min(96%,540px);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 35px #0f172a26}.nav{border:0;background:transparent;color:var(--muted);border-radius:15px;padding:6px 2px;font-size:18px}.nav span{display:block;font-size:9px;font-weight:850;margin-top:2px}.nav.active{background:var(--soft);color:var(--brand)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:#0f172a99}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px}.close{float:right;border:0;background:#f2f4f7;width:35px;height:35px;border-radius:12px}
@media(min-width:850px){.bottom{display:none}.cards{grid-template-columns:repeat(4,1fr)}.learning{grid-template-columns:repeat(4,1fr)}.archivegrid{grid-template-columns:repeat(3,1fr)}#app{padding-bottom:30px}.card.featured{grid-column:span 2;grid-row:span 2}}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.cards,.learning{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const CATS=["All","National","Polity","Economy","Science & Technology","Environment","Defence","International","Sports","Telangana","GI Tags","UNESCO"];
const NEWS=[
 {id:"n1",cat:"SCIENCE & TECHNOLOGY",title:"Technology developments: turn the headline into exam-ready knowledge",text:"A structured learning article: what happened, why it matters, background, static GK and exam angles.",gk:"Institutions, terminology, missions, reports and historical context connected to the development.",exam:"UPSC Prelims • GS-III • TGPSC",facts:["Identify the institution involved.","Remember the key concept and application.","Connect it to a syllabus topic."]},
 {id:"n2",cat:"ENVIRONMENT",title:"Climate and ecology update",text:"Current event → environmental concept → static GK → possible question.",gk:"Ecosystems, biodiversity, climate conventions and environmental institutions.",exam:"UPSC Prelims • GS-III • FBO/FRO",facts:["Concept definition.","Institution/convention link.","India/Telangana relevance."]},
 {id:"n3",cat:"POLITY",title:"Governance and public policy",text:"A current-affairs item connected to constitutional provisions, institutions and governance.",gk:"Constitution, Parliament, executive, judiciary and constitutional bodies.",exam:"UPSC Prelims • GS-II • TGPSC Groups",facts:["Relevant constitutional provision.","Institutional role.","Governance implication."]},
 {id:"n4",cat:"TELANGANA",title:"Telangana current-affairs briefing",text:"Dedicated state-level coverage for TGPSC, SI, PC and FBO/FRO preparation.",gk:"Telangana history, geography, economy, schemes, institutions and culture.",exam:"TGPSC • SI • PC • FBO/FRO",facts:["State-specific fact.","Location/institution.","Exam relevance."]},
 {id:"n5",cat:"ECONOMY",title:"Economy and policy briefing",text:"A sample economy item with static concepts and exam linkage.",gk:"Inflation, monetary policy, fiscal policy, banking and financial institutions.",exam:"UPSC Prelims • GS-III • TGPSC",facts:["Key economic term.","Institution involved.","Likely data point to remember."]},
 {id:"n6",cat:"INTERNATIONAL",title:"International affairs briefing",text:"A sample international-relations item with organization and geography connections.",gk:"International organizations, headquarters, mandates, treaties and member states.",exam:"UPSC Prelims • GS-II • TGPSC",facts:["Organization.","Countries/region.","India's relationship."]}
];
const QUESTIONS=[
 {q:"Which study workflow most effectively converts current affairs into durable exam knowledge?",o:["Memorise only the headline","Connect the event to static concepts, evidence and exam relevance","Read only social media summaries","Ignore the background"],a:1,e:"Connecting current events to static GK, evidence and exam relevance creates reusable knowledge."},
 {q:"If evidence for a current-affairs claim is insufficient, what should a verification-first system do?",o:["Guess the missing fact","Publish it as verified","Mark verification as pending/insufficient","Delete every related article"],a:2,e:"Unverified information should not be presented as established fact."},
 {q:"Which section is most useful for converting a current event into Mains preparation?",o:["Headline only","Background + significance + issues + way forward","Advertisement","App settings"],a:1,e:"Mains answers benefit from context, significance, challenges and a reasoned way forward."},
 {q:"What is the purpose of a historical archive?",o:["Only store today's headlines","Allow retrieval of past editions and events by date/topic","Replace the database","Predict the exam"],a:1,e:"The archive preserves past editions and makes them searchable for revision."},
 {q:"What should happen after repeated mistakes on the same topic?",o:["Ignore them","Lower all scores permanently","Trigger targeted teaching, practice and retesting","Delete the topic"],a:2,e:"A learning loop uses errors to drive remediation and later retesting."}
];
const state=JSON.parse(localStorage.getItem("ei_state")||'{"view":"home","category":"All","dark":false,"score":0,"attempts":0,"mastery":72,"answered":0,"weak":["Indian Polity","Environment"],"bookmarks":[]}');
let qIndex=0,selected=null,answered=false;
const save=()=>localStorage.setItem("ei_state",JSON.stringify(state));
const date=()=>new Intl.DateTimeFormat("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());
function shell(){return `
<header class="top"><div class="bar"><div class="logo">EI</div><div class="brand"><b>Exam Intelligence</b><span>Current Affairs · Exams · AI Tutor</span></div><div class="actions"><button class="icon" onclick="go('search')">⌕</button><button class="icon" onclick="toggleDark()">◐</button></div></div></header>
<main>
<section id="home" class="view active">
<div class="hero"><div class="eyebrow">Daily Command Center</div><h1>Good morning, aspirant 👋</h1><p>Your current affairs, practice, revision and next-best action in one place.</p><div class="date">${date()}</div><div class="stats"><div class="stat"><b>${NEWS.length}</b><span>Edition stories</span></div><div class="stat"><b>18</b><span>Prelims picks</span></div><div class="stat"><b>${state.weak.length.toString().padStart(2,"0")}</b><span>Weak areas</span></div><div class="stat"><b>${state.mastery}%</b><span>Mastery</span></div></div></div>
<div class="notice"><b>Working offline with starter knowledge.</b> The app stores your practice/progress on this phone. Live verified-source ingestion is activated when the cloud API is connected.</div>
<div class="section"><div class="head"><h2>Today's edition</h2><button class="link" onclick="go('news')">View all →</button></div><div class="chips">${CATS.map((c,i)=>`<button class="chip ${state.category===c?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("")}</div></div>
<div class="section"><div class="head"><h2>Top stories</h2><button class="link" onclick="go('news')">Newspaper →</button></div><div class="cards">${NEWS.slice(0,4).map((n,i)=>storyCard(n,i===0)).join("")}</div></div>
<div class="section"><div class="head"><h2>Your next move</h2><button class="link" onclick="go('progress')">Progress →</button></div><div class="learning">
<button class="learn" onclick="go('practice')"><div class="ico">📝</div><div><b>Daily Prelims</b><small>5-question practice</small></div><i>→</i></button>
<button class="learn" onclick="go('tutor')"><div class="ico">🤖</div><div><b>AI Tutor</b><small>Weak: ${state.weak[0]}</small></div><i>→</i></button>
<button class="learn" onclick="go('archive')"><div class="ico">📚</div><div><b>Archive</b><small>2026 → 2022+</small></div><i>→</i></button>
<button class="learn" onclick="go('progress')"><div class="ico">📊</div><div><b>Readiness</b><small>${state.mastery}% mastery</small></div><i>→</i></button>
</div></div>
</section>
<section id="news" class="view"><div class="head"><h2>📰 Today's newspaper</h2><button class="link" onclick="go('home')">Home</button></div><div class="chips">${CATS.map(c=>`<button class="chip ${state.category===c?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("")}</div><div style="margin:11px 0"><input class="search" id="newsq" placeholder="Search today's edition…" oninput="renderNews()"></div><div class="list" id="newslist"></div></section>
<section id="article" class="view"><div class="head"><h2>📖 Exam article</h2><button class="link" onclick="go('news')">← Back</button></div><div id="articlebox"></div></section>
<section id="practice" class="view"><div class="head"><h2>📝 Prelims practice</h2><span class="link" id="qmeta"></span></div><div id="quiz"></div></section>
<section id="tutor" class="view"><div class="head"><h2>🤖 AI Tutor</h2><span class="tag">Personalized</span></div><div class="profile"><div class="profilehead"><div class="avatar">AI</div><div><h2>Let's improve ${state.weak[0]}.</h2><p>Teach → Check → Evaluate → Retest → Mastery</p></div></div></div><div class="chat" id="chat" style="margin-top:11px"><div class="bubble ai">Hi! I know your current weak areas from this device's study history. Ask me to explain a concept, give a question, or test you.</div></div><div class="chips" style="margin-top:9px"><button class="chip" onclick="tutor('Explain the topic simply')">Explain simply</button><button class="chip" onclick="tutor('Give me a Prelims question')">Prelims question</button><button class="chip" onclick="tutor('Test my understanding')">Test me</button></div><div class="chatbar"><input class="search" id="chatinput" placeholder="Ask the tutor…"><button class="btn" onclick="sendTutor()">Send</button></div></section>
<section id="archive" class="view"><div class="head"><h2>📚 Historical archive</h2><button class="link" onclick="go('search')">Search →</button></div><input class="search" placeholder="Search archive…" oninput="archiveFilter(this.value)" style="margin-bottom:11px"><div class="archivegrid" id="years"></div></section>
<section id="search" class="view"><div class="head"><h2>🔎 Search Intelligence</h2><button class="link" onclick="go('home')">Home</button></div><div class="card"><input class="search" id="globalq" placeholder="Try: environment 2025, GI tags Telangana…"><button class="btn full" onclick="globalSearch()">Search</button><div id="results" class="list" style="margin-top:11px"></div></div></section>
<section id="progress" class="view"><div class="head"><h2>📊 My preparation</h2><button class="link" onclick="resetProgress()">Reset demo data</button></div><div class="profile"><div class="profilehead"><div class="avatar">EI</div><div><h2>Learning dashboard</h2><p>Saved locally on this phone</p></div></div><div class="metrics"><div class="metric"><b>${state.mastery}%</b><span>Mastery</span></div><div class="metric"><b>${state.attempts}</b><span>Attempts</span></div><div class="metric"><b>${state.answered}</b><span>Answered</span></div></div><h3 style="font-size:14px;margin:21px 0 5px">Mastery</h3><div class="barline"><i style="width:${state.mastery}%"></i></div><p>Weak areas: ${state.weak.join(" • ")}</p><h3 style="font-size:14px;margin:19px 0 5px">Today's plan</h3><p>① Read today's edition<br>② Practice 5 Prelims questions<br>③ Ask the tutor about ${state.weak[0]}<br>④ Retest tomorrow</p><button class="btn full" onclick="go('practice')">Start today's plan</button></div></section>
</main>
<nav class="bottom"><button class="nav active" data-v="home" onclick="go('home')">⌂<span>Home</span></button><button class="nav" data-v="news" onclick="go('news')">📰<span>News</span></button><button class="nav" data-v="practice" onclick="go('practice')">📝<span>Practice</span></button><button class="nav" data-v="tutor" onclick="go('tutor')">🤖<span>Tutor</span></button><button class="nav" data-v="archive" onclick="go('archive')">📚<span>Archive</span></button></nav>`}
function storyCard(n,featured=false){return `<article class="card ${featured?"featured":""}" onclick="openArticle('${n.id}')"><span class="tag">${n.cat}</span><h3>${n.title}</h3><p>${n.text}</p><div class="meta">Exam-ready · ${n.exam}</div></article>`}
function go(v){state.view=v;save();document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));const el=document.getElementById(v);if(el)el.classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.v===v));window.scrollTo(0,0);if(v==="news")renderNews();if(v==="practice")renderQuiz();if(v==="archive")renderYears();if(v==="progress")refresh();if(v==="home")refresh()}
function refresh(){document.getElementById("app").innerHTML=shell();document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(state.view||"home").classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.v===state.view));if(state.view==="news")renderNews();if(state.view==="practice")renderQuiz();if(state.view==="archive")renderYears();document.body.classList.toggle("dark",state.dark)}
function setCat(c){state.category=c;save();go("news")}
function renderNews(){const q=(document.getElementById("newsq")?.value||"").toLowerCase();const cat=state.category;const arr=NEWS.filter(n=>(cat==="All"||n.cat===cat)&&(!q||JSON.stringify(n).toLowerCase().includes(q)));document.getElementById("newslist").innerHTML=arr.map(n=>`<div class="row" onclick="openArticle('${n.id}')">${storyCard(n,false)}</div>`).join("")||"<div class='card'>No matching articles.</div>"}
function openArticle(id){const n=NEWS.find(x=>x.id===id);document.getElementById("articlebox").innerHTML=`<div class="article"><span class="tag">${n.cat}</span><h1>${n.title}</h1><div class="meta">Exam Intelligence · structured article</div><h2>What happened</h2><p>${n.text}</p><h2>Why important?</h2><p>This section explains significance, the underlying concept and how it may be useful in examination preparation.</p><div class="callout"><b>Static GK connection</b><br>${n.gk}</div><h2>Key facts</h2><ul>${n.facts.map(x=>`<li>${x}</li>`).join("")}</ul><h2>Prelims</h2><p>Identify the institution, terminology, associated facts and possible statement-based traps.</p><h2>Mains</h2><p>Use the topic as contemporary evidence. Discuss context, significance, challenges and a balanced way forward.</p><h2>Exam relevance</h2><p>${n.exam}</p><button class="btn full" onclick="go('practice')">Practice related questions</button></div>`;go("article")}
function renderQuiz(){const box=document.getElementById("quiz");if(!box)return;if(qIndex>=QUESTIONS.length){box.innerHTML=`<div class="article"><span class="tag">SESSION COMPLETE</span><h1>Score ${state.score}/${QUESTIONS.length} 🎉</h1><p>Your result has been saved locally. The full cloud version will feed this into mastery, errors, revision and next-best-action.</p><button class="btn full" onclick="qIndex=0;selected=null;answered=false;go('practice')">Retry</button></div>`;return}const x=QUESTIONS[qIndex];document.getElementById("qmeta").textContent=`${qIndex+1}/${QUESTIONS.length}`;box.innerHTML=`<div class="quiz"><div class="qtop"><span>Mixed difficulty</span><span>${state.score} correct</span></div><h2>${x.q}</h2><div class="options">${x.o.map((o,i)=>`<button class="opt ${selected===i?"sel":""} ${answered&&i===x.a?"correct":""} ${answered&&selected===i&&i!==x.a?"wrong":""}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>${answered?`<div class="feedback"><b>${selected===x.a?"Correct ✓":"Review this concept"}</b><br>${x.e}</div><button class="btn full" onclick="nextQ()">${qIndex===QUESTIONS.length-1?"Finish":"Next question"}</button>`:`<button class="btn full" onclick="submitQ()" ${selected===null?"disabled":""}>Submit answer</button>`}</div>`}
function choose(i){if(!answered){selected=i;renderQuiz()}}
function submitQ(){if(selected===null)return;answered=true;state.attempts++;state.answered++;if(selected===QUESTIONS[qIndex].a){state.score++;state.mastery=Math.min(100,state.mastery+1)}else{state.mastery=Math.max(0,state.mastery-1)}save();renderQuiz()}
function nextQ(){qIndex++;selected=null;answered=false;renderQuiz()}
function tutor(text){document.getElementById("chat").insertAdjacentHTML("beforeend",`<div class="bubble me">${text}</div><div class="bubble ai">${text.includes("question")||text.includes("Test")?"Try this: explain the difference between a Fundamental Right and a Directive Principle in two sentences.":"Let's start from zero. First define the concept in simple language, then connect it to a real example, then we'll check your understanding with a question."}</div>`);window.scrollTo(0,document.body.scrollHeight)}
function sendTutor(){const i=document.getElementById("chatinput");if(i.value.trim()){tutor(i.value.trim());i.value=""}}
function renderYears(){document.getElementById("years").innerHTML=["2026","2025","2024","2023","2022","Older archive"].map(y=>`<div class="year"><b>${y}</b><small>Daily editions · events · static GK</small><button class="btn secondary full" onclick="alert('${y} archive: the production API will load real editions here.')">Open</button></div>`).join("")}
function archiveFilter(v){document.getElementById("years").innerHTML=(v?["2026","2025","2024","2023","2022"].filter(y=>y.includes(v)||v.toLowerCase().includes("archive")):["2026","2025","2024","2023","2022","Older archive"]).map(y=>`<div class="year"><b>${y}</b><small>Daily editions · events · static GK</small><button class="btn secondary full" onclick="alert('${y} archive selected')">Open</button></div>`).join("")}
function globalSearch(){const q=document.getElementById("globalq").value.trim().toLowerCase();const r=NEWS.filter(n=>JSON.stringify(n).toLowerCase().includes(q));document.getElementById("results").innerHTML=r.length?r.map(n=>`<div class="row" onclick="openArticle('${n.id}')"><span class="tag">${n.cat}</span><h3>${n.title}</h3><p>${n.text}</p></div>`).join(""):`<div class="row"><b>${q||"Search"}</b><p>No starter-data match. The production search service will query the full historical knowledge base.</p></div>`}
function toggleDark(){state.dark=!state.dark;save();refresh()}
function resetProgress(){if(confirm("Reset local practice progress?")){Object.assign(state,{score:0,attempts:0,mastery:72,answered:0});qIndex=0;selected=null;answered=false;save();refresh()}}
refresh();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
