name: Fix Exam Intelligence study notes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace mobile app with study-note UI
        shell: bash
        run: |
          echo '' | base64 -d > web/app/page.tsx

      - name: Validate
        run: |
          grep -q "Open study notes" web/app/page.tsx
          grep -q "Static GK — remember these" web/app/page.tsx
          grep -q "Easy memory rule" web/app/page.tsx

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/page.tsx
          git commit -m "Fix study notes and simple point-wise learning" || echo "Nothing to commit"
          git push
