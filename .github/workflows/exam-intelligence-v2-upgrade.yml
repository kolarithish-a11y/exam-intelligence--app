name: Upgrade Exam Intelligence v2 - live archive static GK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write upgraded API
        shell: bash
        run: |
          echo '' | base64 -d > server/app.py

      - name: Write upgraded mobile app
        shell: bash
        run: |
          echo '' | base64 -d > web/app/page.tsx

      - name: Validate Python
        run: |
          python -m py_compile server/app.py


      - name: Install automatic ingestion workflow
        shell: bash
        run: |
          mkdir -p .github/workflows
          echo '' | base64 -d > .github/workflows/auto-ingest.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.py web/app/page.tsx
          git commit -m "Upgrade live archive static GK and automatic refresh" || echo "Nothing to commit"
          git push
