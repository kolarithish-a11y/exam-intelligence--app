name: Upgrade live current affairs ingestion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install upgraded API ingestion
        shell: bash
        run: |
          echo "" | base64 -d > server/app.py
          echo "ZmFzdGFwaT09MC4xMTYuMQp1dmljb3JuW3N0YW5kYXJkXT09MC4zNS4wCmh0dHB4PT0wLjI4LjEKZmVlZHBhcnNlcj09Ni4wLjExCnB5ZGFudGljPT0yLjExLjcKYmVhdXRpZnVsc291cDQ9PTQuMTMuNQo=" | base64 -d > server/requirements.txt

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.py server/requirements.txt
          git commit -m "Upgrade live current affairs ingestion and source coverage" || echo "Nothing to commit"
          git push
