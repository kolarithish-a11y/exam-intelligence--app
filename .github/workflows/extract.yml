name: Extract Exam Intelligence application

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application ZIP
        run: |
          mkdir -p extracted
          unzip -o Exam-Intelligence-Live-App-Source.zip -d extracted
          cp -R extracted/exam-intelligence-production/. .
          rm -rf extracted
          rm -f Exam-Intelligence-Live-App-Source.zip

      - name: Commit extracted application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract complete Exam Intelligence application" || echo "Nothing to commit"
          git push
