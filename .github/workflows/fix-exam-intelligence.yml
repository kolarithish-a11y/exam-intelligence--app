name: Fix Exam Intelligence mobile navigation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace mobile page
        run: |
          echo "" | base64 -d > web/app/page.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/page.tsx
          git commit -m "Fix mobile navigation and interactive screens" || echo "Nothing to commit"
          git push
