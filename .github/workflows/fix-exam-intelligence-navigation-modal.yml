name: Fix Exam Intelligence navigation and study modal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace CSS with mobile interaction fix
        shell: bash
        run: |
          echo '' | base64 -d > web/app/globals.css

      - name: Validate
        run: |
          grep -q "grid-template-columns:repeat(6,1fr)" web/app/globals.css
          grep -q "z-index:200" web/app/globals.css
          test -s web/app/page.tsx

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/globals.css
          git commit -m "Fix mobile navigation and study modal interactions" || echo "Nothing to commit"
          git push
